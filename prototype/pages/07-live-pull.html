<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<script>/* 早于首次绘制应用 ?theme= 以免过渡色被冻结 */try{const t=new URLSearchParams(location.search).get("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>拉流播放 · ffc 原型</title>
<link rel="stylesheet" href="../assets/design.css">
<style>
  .tabsrow { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .tabsrow .c-tabs { border-bottom: 0; padding: 0; }
  .tabsrow .c-tabs button { height: 34px; border-radius: var(--r-sm); padding: 0 13px; }
  .tabsrow .c-tabs button.is-on { background: var(--bg-card); box-shadow: var(--shadow-1); }
  .tabsrow .c-tabs button.is-on::after { display: none; }
  .tabsrow .spacer { flex: 1 1 auto; }

  .addr { display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin-bottom: 16px; }
  .addr .c-select { width: 92px; flex: 0 0 auto; }
  .addr .c-input { flex: 1 1 auto; height: 34px; }
  .addr .c-btn.is-primary { height: 34px; padding: 0 18px; }

  .work { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 16px; align-items: start; }

  /* 播放器 */
  .player { position: relative; aspect-ratio: 16/9; background: #05060a; overflow: hidden;
    border-radius: 0 0 var(--r-md) var(--r-md); }
  .stage {
    position: absolute; inset: 0;
    background:
      radial-gradient(60% 80% at 22% 18%, rgba(94,132,255,.55), transparent 60%),
      radial-gradient(50% 70% at 82% 30%, rgba(255,120,180,.42), transparent 62%),
      radial-gradient(70% 90% at 55% 95%, rgba(90,220,190,.35), transparent 60%),
      linear-gradient(160deg, #0b1020, #131a2e 55%, #0a0d18);
  }
  .stage::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay;
  }
  .frametxt {
    position: absolute; left: 26px; bottom: 74px; color: rgba(255,255,255,.92);
    font-size: 22px; font-weight: 650; letter-spacing: -0.01em; text-shadow: 0 2px 16px rgba(0,0,0,.5);
  }
  .framesub { position: absolute; left: 27px; bottom: 52px; color: rgba(255,255,255,.55); font-size: 12px; }

  .overlay-tl { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; }
  .ovchip { display:inline-flex; align-items:center; gap:5px; height: 22px; padding: 0 9px;
    border-radius: 6px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.12);
    font-size: 11px; color: #e2e8f0; backdrop-filter: blur(8px); }
  .ovchip .d { width:5px; height:5px; border-radius:50%; background: var(--bad); box-shadow: 0 0 0 3px rgba(255,107,107,.25); }

  .pbar { position: absolute; left: 0; right: 0; bottom: 0; display:flex; align-items:center; gap: 12px;
    padding: 9px 12px; background: linear-gradient(180deg, transparent, rgba(0,0,0,.72));
    font-size: 11px; color: #cbd5e1; font-variant-numeric: tabular-nums; }
  .pbar .sp { flex: 1 1 auto; }
  .pbar .playbtn { width: 28px; height: 28px; border-radius: 50%; display:grid; place-items:center;
    background: rgba(255,255,255,.14); color: #fff; }
  .pbar .playbtn svg { width: 13px; height: 13px; }
  .pbar .track { width: 92px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.22); position: relative; }
  .pbar .track i { position: absolute; left:0; top:0; bottom:0; width: 62%; border-radius: 3px; background: #fff; }

  /* 右栏 */
  .panel { position: sticky; top: 0; }
  .pbody { padding: 14px 16px; display: grid; gap: 16px; }
  .glabel { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 9px; }
  .recent { display: grid; gap: 2px; }
  .recent button { display:flex; gap: 9px; align-items:center; padding: 8px; border-radius: var(--r-sm); text-align:left; width: 100%; }
  .recent button:hover { background: var(--bg-hover); }
  .recent .u { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent .m { display: block; font-size: 10.5px; color: var(--fg-3); margin-top: 2px; }
  .recent .ico { width: 22px; height: 22px; border-radius: 6px; background: var(--bg-card-2); border: 1px solid var(--line); display:grid; place-items:center; color: var(--fg-3); flex: 0 0 auto; }
  .recent .ico svg { width: 12px; height: 12px; }

  .stat { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat div { padding: 9px 10px; border-radius: var(--r-sm); background: var(--bg-card-2); border: 1px solid var(--line); }
  .stat .k { font-size: 10.5px; color: var(--fg-3); }
  .stat .v { font-size: 15px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 10px; font-weight: 500; color: var(--fg-3); margin-left: 2px; }

  /* ── 自适应：播放器 + 320 右侧数据，≤1024 单列 ── */
  @media (max-width: 1240px) {
    .work { grid-template-columns: minmax(0,1fr) 292px; gap: 12px; }
  }
  @media (max-width: 1024px) {
    .work { grid-template-columns: minmax(0,1fr); }
    .panel { position: static; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <header class="topbar" id="top"></header>
    <div class="page">
      <div class="tabsrow">
        <div class="c-tabs">
          <button>文件推流</button>
          <button>录屏推流</button>
          <button class="is-on">拉流播放</button>
        </div>
        <div class="spacer"></div>
        <span class="c-pill is-ghost">播放器直连 · 不经后端转发</span>
      </div>

      <!-- 地址栏 -->
      <div class="c-card addr">
        <select class="c-select"><option>自动</option><option>RTMP</option><option>HLS</option><option>FLV</option></select>
        <input class="c-input is-mono" value="https://live.example.com/app/stream.flv">
        <button class="c-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4.5V10h-5.5"/></svg>最近</button>
        <button class="c-btn is-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.5v13l11-6.5Z"/></svg>
          播放
        </button>
      </div>

      <div class="work">
        <!-- 播放器 -->
        <section class="c-card" style="overflow:hidden">
          <div class="c-card-hd">
            <h2>播放</h2>
            <span class="c-pill is-brand"><span class="dot"></span>直播中</span>
            <div class="right" style="font-size:11.5px;color:var(--fg-3)">已播放 00:12:36</div>
          </div>
          <div class="player">
            <div class="stage"></div>
            <div class="overlay-tl">
              <span class="ovchip"><span class="d"></span>LIVE</span>
              <span class="ovchip">1920×1080 · 30fps</span>
              <span class="ovchip">H.264 / AAC</span>
            </div>
            <div class="frametxt">演播室画面</div>
            <div class="framesub">第 2 机位 · 主画面</div>
            <div class="pbar">
              <button class="playbtn"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.6" height="14" rx="1"/><rect x="13.4" y="5" width="3.6" height="14" rx="1"/></svg></button>
              <div class="track"><i></i></div>
              <span>12:36</span>
              <span class="sp"></span>
              <span>6000 kbps</span>
              <span>丢帧 0</span>
              <span>缓冲 0.8 s</span>
              <button class="c-icon-btn is-sm" style="color:#cbd5e1" title="全屏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
            </div>
          </div>
        </section>

        <!-- 信息 -->
        <section class="c-card panel">
          <div class="c-card-hd"><h2>播放信息</h2></div>
          <div class="pbody">
            <div>
              <div class="glabel">实时</div>
              <div class="stat">
                <div><div class="k">分辨率</div><div class="v">1080<small>p</small></div></div>
                <div><div class="k">帧率</div><div class="v">30<small>fps</small></div></div>
                <div><div class="k">码率</div><div class="v">6.0<small>Mbps</small></div></div>
                <div><div class="k">缓冲</div><div class="v">0.8<small>s</small></div></div>
              </div>
            </div>

            <div>
              <div class="glabel">最近播放</div>
              <div class="recent">
                <button>
                  <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13.5a3.5 3.5 0 0 0 5 0l2.5-2.5a3.5 3.5 0 0 0-5-5l-1 1"/><path d="M14 10.5a3.5 3.5 0 0 0-5 0L6.5 13a3.5 3.5 0 0 0 5 5l1-1"/></svg></span>
                  <span style="min-width:0">
                    <span class="u">live.example.com/app/stream.flv</span>
                    <span class="m">今天 22:41 · FLV</span>
                  </span>
                </button>
                <button>
                  <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13.5a3.5 3.5 0 0 0 5 0l2.5-2.5a3.5 3.5 0 0 0-5-5l-1 1"/><path d="M14 10.5a3.5 3.5 0 0 0-5 0L6.5 13a3.5 3.5 0 0 0 5 5l1-1"/></svg></span>
                  <span style="min-width:0">
                    <span class="u">rtmp://push.example.com/show/cam2</span>
                    <span class="m">昨天 20:10 · RTMP</span>
                  </span>
                </button>
                <button>
                  <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13.5a3.5 3.5 0 0 0 5 0l2.5-2.5a3.5 3.5 0 0 0-5-5l-1 1"/><path d="M14 10.5a3.5 3.5 0 0 0-5 0L6.5 13a3.5 3.5 0 0 0 5 5l1-1"/></svg></span>
                  <span style="min-width:0">
                    <span class="u">https://cdn.example.com/hls/index.m3u8</span>
                    <span class="m">10-19 15:02 · HLS</span>
                  </span>
                </button>
              </div>
            </div>

            <div class="c-note">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.2M12 8.2h.01"/></svg>
              <div class="grow">支持 http(s)、rtmp、srt、ws；跨域地址若报错，建议先试 FLV。</div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
<div class="proto-tag">原型 v1 · 拉流播放</div>
<script src="../assets/shell.js"></script>
<script>
  ffcShell({
    active: 'live',
    title: '直播',
    sub: '拉流播放',
    engine: { text: '就绪', path: '6.1' }
  });
</script>
<script src="../assets/nav.js"></script>
</body>
</html>
