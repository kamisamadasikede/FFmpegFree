<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<script>/* 早于首次绘制应用 ?theme= 以免过渡色被冻结 */try{const t=new URLSearchParams(location.search).get("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>设置 · ffc 原型</title>
<link rel="stylesheet" href="../assets/design.css">
<style>
  .work { display: grid; grid-template-columns: 176px minmax(0, 1fr); gap: 16px; align-items: start; }

  /* 子导航 */
  .subnav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; }
  .subnav a {
    display: flex; align-items: center; gap: 9px;
    height: 34px; padding: 0 10px; border-radius: var(--r-sm);
    font-size: 13px; color: var(--fg-2); text-decoration: none;
  }
  .subnav a svg { width: 16px; height: 16px; opacity: .8; }
  .subnav a:hover { background: var(--bg-hover); color: var(--fg-1); }
  .subnav a.is-on { background: var(--bg-active); color: var(--fg-1); font-weight: 600; }
  .subnav a.is-on svg { color: var(--brand); opacity: 1; }
  .subnav .sep { height: 1px; background: var(--line); margin: 8px 4px; }

  /* 表单 */
  .sect { padding: 20px 22px; }
  .sect + .sect { border-top: 1px solid var(--line); }
  .sect-hd { margin-bottom: 16px; }
  .sect-hd h3 { margin: 0 0 3px; font-size: 13.5px; font-weight: 620; }
  .sect-hd p { margin: 0; font-size: 12px; color: var(--fg-3); }
  .rows { display: grid; gap: 16px; max-width: 560px; }
  .frow { display: grid; grid-template-columns: 148px minmax(0,1fr); gap: 14px; align-items: start; }
  .frow > label { font-size: 12.5px; color: var(--fg-2); padding-top: 7px; }
  .frow .ctl { display: grid; gap: 6px; min-width: 0; }
  .frow .hint { font-size: 11.5px; color: var(--fg-3); line-height: 1.5; }

  /* 主题卡 */
  .themes { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
  .theme { border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg-card-2); padding: 6px; text-align: left; }
  .theme.is-on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .theme .pv { height: 52px; border-radius: 4px; overflow: hidden; display: flex; border: 1px solid var(--line); }
  .theme .pv .l { width: 30%; }
  .theme .pv .r { flex: 1; padding: 5px; display: grid; gap: 3px; align-content: start; }
  .theme .pv .r i { height: 4px; border-radius: 2px; display: block; }
  .theme .cap { display: flex; align-items: center; gap: 6px; padding: 7px 3px 3px; font-size: 12px; color: var(--fg-2); }
  .theme.is-on .cap { color: var(--fg-1); font-weight: 600; }
  .theme .cap .rad { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line-strong); flex: 0 0 auto; }
  .theme.is-on .cap .rad { border-color: var(--brand); background: radial-gradient(circle, var(--brand) 0 3.5px, transparent 4px); }

  .pv-dark .l { background: #191d24; } .pv-dark .r { background: #0e1116; }
  .pv-dark .r i { background: rgba(255,255,255,.12); }
  .pv-light .l { background: #eef0f3; } .pv-light .r { background: #f7f8fa; }
  .pv-light .r i { background: rgba(15,23,42,.12); }
  .pv-auto { background: linear-gradient(90deg, #0e1116 0 50%, #f7f8fa 50% 100%); }
  .pv-auto .l { background: linear-gradient(90deg, #191d24 0 100%); }
  .pv-auto .r i { background: rgba(120,130,150,.3); }

  /* 目录选择 */
  .pathpick { display: flex; gap: 8px; }
  .pathpick .c-input { font-family: var(--font-mono); font-size: 11.5px; }

  /* 组件行 */
  .comp { display: grid; gap: 8px; max-width: 620px; }
  .comprow {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 13px; border-radius: var(--r-sm);
    background: var(--bg-card-2); border: 1px solid var(--line);
  }
  .comprow .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
    background: var(--bg-card); border: 1px solid var(--line); color: var(--fg-2); flex: 0 0 auto; }
  .comprow .ic svg { width: 15px; height: 15px; }
  .comprow .t1 { font-size: 12.5px; font-weight: 600; }
  .comprow .t2 { font-size: 11px; color: var(--fg-3); margin-top: 2px; font-family: var(--font-mono); }
  .comprow .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  /* 底部保存条 */
  .settcard { display: flex; flex-direction: column; max-height: calc(100vh - 64px - 48px); }
  .sects { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .savebar2 {
    position: static;
    display: flex; align-items: center; gap: 10px;
    padding: 12px 22px; border-top: 1px solid var(--line);
    background: var(--bg-card);
    box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.26);
    border-radius: 0 0 var(--r-md) var(--r-md);
  }
  .savebar2 .sp { flex: 1 1 auto; }
  .savebar2 .dirty { font-size: 12px; color: var(--warn); display: flex; align-items: center; gap: 6px; }
  .savebar2 .dirty .d { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }

  /* ── 自适应：176 子导航 + 内容，≤900 导航变顶部横向胶囊 ── */
  @media (max-width: 1024px) {
    .work { grid-template-columns: 150px minmax(0,1fr); gap: 12px; }
  }
  @media (max-width: 900px) {
    .work { grid-template-columns: minmax(0,1fr); gap: 12px; }
    .subnav {
      position: static; flex-direction: row; flex-wrap: nowrap;
      gap: 4px; overflow-x: auto; padding-bottom: 2px;
    }
    .subnav a { flex: none; white-space: nowrap; border: 1px solid transparent; }
    .subnav a.is-on { border-color: var(--line); background: var(--bg-card); }
    .subnav .sep { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <header class="topbar" id="top"></header>
    <div class="page">
      <div class="work">
        <!-- 子导航 -->
        <nav class="subnav">
          <a class="is-on" data-sect="0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M4.2 7.5l1.9 1.1M17.9 15.4l1.9 1.1M4.2 16.5l1.9-1.1M17.9 8.6l1.9-1.1"/></svg>
            通用
          </a>
          <a data-sect="1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
            外观
          </a>
          <div class="sep"></div>
          <a data-sect="2">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
            组件管理
          </a>
          <a href="11-about.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.2M12 8.2h.01"/></svg>
            关于
          </a>
        </nav>

        <!-- 内容 -->
        <section class="c-card settcard">
          <div class="sects">
          <div class="sect">
            <div class="sect-hd">
              <h3>通用</h3>
              <p>语言、输出位置与并发</p>
            </div>
            <div class="rows">
              <div class="frow">
                <label>界面语言</label>
                <div class="ctl">
                  <select class="c-select"><option>简体中文</option><option>English</option><option>日本語</option></select>
                  <div class="hint">切换后立即生效，无需重启。</div>
                </div>
              </div>

              <div class="frow">
                <label>默认输出位置</label>
                <div class="ctl">
                  <div class="pathpick">
                    <input class="c-input" value="D:\Tools\ffc\output">
                    <button class="c-btn">选择…</button>
                  </div>
                  <div class="hint">同名文件自动加序号，不会覆盖已有文件。</div>
                </div>
              </div>

              <div class="frow">
                <label>同时转换数量</label>
                <div class="ctl">
                  <select class="c-select" style="max-width:150px"><option>3 个（推荐）</option><option>1 个</option><option>2 个</option><option>5 个</option></select>
                  <div class="hint">超过 CPU 核心数会变慢；硬件编码可适当提高。</div>
                </div>
              </div>

              <div class="frow">
                <label>完成后通知</label>
                <div class="ctl">
                  <div style="display:flex;align-items:center;gap:10px;height:32px">
                    <div class="c-switch is-on"></div>
                    <span style="font-size:12.5px;color:var(--fg-2)">窗口不在前台时发系统通知</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="sect">
            <div class="sect-hd">
              <h3>外观</h3>
              <p>主题与界面密度</p>
            </div>
            <div class="rows">
              <div class="frow">
                <label>主题</label>
                <div class="ctl">
                  <div class="themes">
                    <button class="theme is-on">
                      <div class="pv pv-dark"><div class="l"></div><div class="r"><i style="width:70%"></i><i style="width:90%"></i><i style="width:50%"></i><i style="width:80%"></i></div></div>
                      <div class="cap"><span class="rad"></span>深色</div>
                    </button>
                    <button class="theme">
                      <div class="pv pv-light"><div class="l"></div><div class="r"><i style="width:70%"></i><i style="width:90%"></i><i style="width:50%"></i><i style="width:80%"></i></div></div>
                      <div class="cap"><span class="rad"></span>浅色</div>
                    </button>
                    <button class="theme">
                      <div class="pv pv-auto"><div class="l"></div><div class="r"><i style="width:70%"></i><i style="width:90%"></i><i style="width:50%"></i><i style="width:80%"></i></div></div>
                      <div class="cap"><span class="rad"></span>跟随系统</div>
                    </button>
                  </div>
                </div>
              </div>

              <div class="frow">
                <label>界面密度</label>
                <div class="ctl">
                  <div class="c-seg">
                    <button>紧凑</button>
                    <button class="is-on">标准</button>
                    <button>宽松</button>
                  </div>
                  <div class="hint">影响列表行高与卡片内边距。</div>
                </div>
              </div>
            </div>
          </div>

          <div class="sect">
            <div class="sect-hd">
              <h3>组件</h3>
              <p>转换、文档、语音依赖的本地组件</p>
            </div>
            <div class="comp">
              <div class="comprow">
                <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M10 3v2.5M14 3v2.5M10 18.5V21M14 18.5V21M3 10h2.5M3 14h2.5M18.5 10H21M18.5 14H21"/></svg></div>
                <div>
                  <div class="t1">ffmpeg 转换组件</div>
                  <div class="t2">6.1 · D:\Tools\ffmpeg\bin</div>
                </div>
                <div class="right">
                  <span class="c-pill is-ok"><span class="dot"></span>已就绪</span>
                  <button class="c-btn is-sm">重新检测</button>
                </div>
              </div>
              <div class="comprow">
                <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/></svg></div>
                <div>
                  <div class="t1">文档组件（LibreOffice 内核）</div>
                  <div class="t2">未安装 · 约 320 MB</div>
                </div>
                <div class="right">
                  <span class="c-pill is-warn"><span class="dot"></span>未安装</span>
                  <button class="c-btn is-sm is-primary">安装</button>
                </div>
              </div>
              <div class="comprow">
                <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></div>
                <div>
                  <div class="t1">语音识别组件</div>
                  <div class="t2">未安装 · 标准模型 244 MB</div>
                </div>
                <div class="right">
                  <span class="c-pill is-warn"><span class="dot"></span>未安装</span>
                  <button class="c-btn is-sm is-primary">安装</button>
                </div>
              </div>
            </div>
          </div>

          </div>

          <div class="savebar2">
            <span class="dirty"><span class="d"></span>有未保存的修改</span>
            <span class="sp"></span>
            <button class="c-btn">还原默认</button>
            <button class="c-btn is-primary">保存设置</button>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
<div class="proto-tag">原型 v1 · 设置</div>
<script src="../assets/shell.js"></script>
<script>
  ffcShell({
    active: 'settings',
    title: '设置',
    sub: '通用 · 外观 · 组件',
    engine: { text: '就绪', path: '6.1' }
  });
</script>
<script src="../assets/nav.js"></script>
</body>
</html>
