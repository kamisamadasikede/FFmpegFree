<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<script>/* 早于首次绘制应用 ?theme= 以免过渡色被冻结 */try{const t=new URLSearchParams(location.search).get("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>录屏推流 · ffc 原型</title>
<link rel="stylesheet" href="../assets/design.css">
<style>
  .tabsrow { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .tabsrow .c-tabs { border-bottom: 0; padding: 0; }
  .tabsrow .c-tabs button { height: 34px; border-radius: var(--r-sm); padding: 0 13px; }
  .tabsrow .c-tabs button.is-on { background: var(--bg-card); box-shadow: var(--shadow-1); }
  .tabsrow .c-tabs button.is-on::after { display: none; }
  .tabsrow .spacer { flex: 1 1 auto; }

  .col { display: grid; gap: 16px; grid-template-rows: auto minmax(0, 1fr); min-width: 0;
    height: calc(100vh - 64px - 48px - 50px); }
  .work { display: grid; grid-template-columns: minmax(0,1fr) 356px; gap: 16px; align-items: start; }
  .prevcard { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

  /* 屏幕源 */
  .sources { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
  .srcard {
    position: relative; border-radius: var(--r-sm); overflow: hidden;
    border: 1px solid var(--line); background: var(--bg-card-2);
    text-align: left; transition: border-color var(--dur), transform var(--dur);
  }
  .srcard:hover { border-color: var(--line-strong); }
  .srcard .shot {
    aspect-ratio: 16/9; position: relative;
    background: linear-gradient(150deg, #16202c, #1d2938 60%, #22303f);
    display: grid; place-items: center;
  }
  .srcard .shot .win {
    width: 70%; height: 62%; border-radius: 3px;
    background: linear-gradient(180deg, #24303e, #1a232e);
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: 0 6px 18px rgba(0,0,0,.4);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .srcard .shot .win .bar2 { height: 8px; background: rgba(255,255,255,.07); display:flex; gap:2px; align-items:center; padding:0 3px; }
  .srcard .shot .win .bar2 i { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,.22); }
  .srcard .shot .win .ln2 { flex: 1; margin: 5px; border-radius: 2px;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,.10) 0 2px, transparent 2px 6px); }
  .srcard .cap { padding: 8px 9px; }
  .srcard .cap .n { font-size: 12px; font-weight: 550; display:flex; align-items:center; gap:6px; }
  .srcard .cap .m { font-size: 10.5px; color: var(--fg-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .srcard.is-on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), 0 6px 20px rgba(79,140,255,.18); }
  .srcard.is-on .cap .n { color: var(--brand-hi); }
  .srcard .checkmark {
    position: absolute; right: 7px; top: 7px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--brand); color: var(--brand-ink); display: none; place-items: center;
  }
  .srcard.is-on .checkmark { display: grid; }
  .srcard .checkmark svg { width: 10px; height: 10px; }

  /* 预览 */
  .player { position: relative; flex: 1 1 auto; min-height: 0; background: #07080a; overflow: hidden;
    display: grid; place-items: center; }
  .player .grid-bg { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at center, #000 20%, transparent 78%); }
  .player .center { position: relative; text-align: center; }
  .player .center .t { font-size: 13px; color: #9aa2b0; }
  .player .center .d { font-size: 11.5px; color: #666e7b; margin-top: 5px; }
  .overlay-tl { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; }
  .ovchip { display:inline-flex; align-items:center; gap:5px; height: 22px; padding: 0 9px;
    border-radius: 6px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.10);
    font-size: 11px; color: #cfd6e0; }
  .ovchip .d { width:5px; height:5px; border-radius:50%; background:#6b7380; }
  .ovchip.is-rec .d { background: var(--bad); box-shadow: 0 0 0 3px rgba(255,107,107,.22); }
  .pbar { display:flex; align-items:center; gap:14px; padding: 8px 12px;
    border-top: 1px solid rgba(255,255,255,.07); background:#0d1015;
    font-size: 11px; color:#7b8391; font-variant-numeric: tabular-nums; }
  .pbar .sp { flex:1 1 auto; } .pbar b { color:#cfd6e0; }

  /* 右侧 */
  .panel { position: sticky; top: 0; display:flex; flex-direction: column; }
  .pbody { padding: 14px 16px; display: grid; gap: 14px; }
  .group { display: grid; gap: 10px; }
  .group + .group { border-top: 1px solid var(--line); padding-top: 14px; }
  .glabel { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); }
  .prow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .toggle { display:flex; align-items:center; gap:10px; padding: 9px 10px;
    border-radius: var(--r-sm); background: var(--bg-card-2); border: 1px solid var(--line); }
  .toggle .t1 { font-size: 12.5px; font-weight: 550; }
  .toggle .t2 { font-size: 11px; color: var(--fg-3); margin-top: 2px; }
  .toggle .c-switch { margin-left: auto; }
  .cta { border-top: 1px solid var(--line); padding: 12px 16px 14px; }
  .archpath { display:flex; align-items:center; gap:8px; padding: 7px 9px; border-radius: var(--r-xs);
    background: var(--bg-app); border: 1px solid var(--line);
    font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
  .archpath span { flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ── 自适应：预览 + 356 设置栏，≤1024 单列 ── */
  @media (max-width: 1240px) {
    .work { grid-template-columns: minmax(0,1fr) 320px; gap: 12px; }
  }
  @media (max-width: 1024px) {
    .work { grid-template-columns: minmax(0,1fr); }
    .panel { position: static; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <header class="topbar" id="top"></header>
    <div class="page">
      <div class="tabsrow">
        <div class="c-tabs">
          <button>文件推流</button>
          <button class="is-on">录屏推流</button>
          <button>拉流播放</button>
        </div>
        <div class="spacer"></div>
        <span class="c-pill is-warn"><span class="dot"></span>演示模式 · 未连接真实推流</span>
      </div>

      <div class="work">
        <div class="col">
          <!-- 屏幕源 -->
          <section class="c-card">
            <div class="c-card-hd">
              <h2>屏幕源</h2>
              <span class="count">3 个可用</span>
              <div class="right">
                <button class="c-btn is-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4.5V10h-5.5"/></svg>刷新</button>
              </div>
            </div>
            <div class="c-card-bd">
              <div class="sources">
                <button class="srcard is-on">
                  <span class="checkmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg></span>
                  <div class="shot">
                    <div class="win" style="width:82%;height:70%">
                      <div class="bar2"><i></i><i></i><i></i></div>
                      <div class="ln2"></div>
                    </div>
                  </div>
                  <div class="cap">
                    <div class="n">显示器 1</div>
                    <div class="m">2560×1440 · 100%</div>
                  </div>
                </button>

                <button class="srcard">
                  <div class="shot">
                    <div class="win">
                      <div class="bar2"><i></i><i></i><i></i></div>
                      <div class="ln2" style="background: repeating-linear-gradient(180deg, rgba(120,200,255,.22) 0 2px, transparent 2px 6px)"></div>
                    </div>
                  </div>
                  <div class="cap">
                    <div class="n">窗口</div>
                    <div class="m">VS Code · 1920×1200</div>
                  </div>
                </button>

                <button class="srcard">
                  <div class="shot" style="background: linear-gradient(150deg,#1a1622,#241d31)">
                    <div style="position:absolute;inset:16px;border:1.5px dashed rgba(255,255,255,.22);border-radius:4px;display:grid;place-items:center;font-size:10.5px;color:#8b93a1">拖动框选</div>
                  </div>
                  <div class="cap">
                    <div class="n">区域</div>
                    <div class="m">自定义 · 未选择</div>
                  </div>
                </button>
              </div>
            </div>
          </section>

          <!-- 预览 -->
          <section class="c-card prevcard">
            <div class="c-card-hd">
              <h2>预览</h2>
              <span class="c-pill is-ghost">显示器 1</span>
              <div class="right" style="font-size:11.5px;color:var(--fg-3)">采集帧率跟随推流帧率</div>
            </div>
            <div class="player">
              <div class="grid-bg"></div>
              <div class="overlay-tl">
                <span class="ovchip"><span class="d"></span>未开始</span>
                <span class="ovchip">2560×1440 → 1920×1080</span>
              </div>
              <div class="center">
                <div class="t">还没有进行中的预览</div>
                <div class="d">开始录屏推流后，这里显示实时画面</div>
              </div>
              <div class="pbar" style="position:absolute;left:0;right:0;bottom:0">
                <span><b>0.0</b> fps</span>
                <span><b>0</b> kbps</span>
                <span class="sp"></span>
                <span>00:00:00</span>
              </div>
            </div>
          </section>
        </div>

        <!-- 设置 -->
        <section class="c-card panel">
          <div class="c-card-hd"><h2>推流设置</h2></div>
          <div class="pbody">
            <div class="group">
              <div class="glabel">目标</div>
              <div class="c-field">
                <label>推流地址</label>
                <input class="c-input is-mono" value="rtmp://live.example.com/app">
              </div>
              <div class="c-field">
                <label>推流码 / 口令</label>
                <input class="c-input is-mono" type="password" value="••••••••••••">
              </div>
            </div>

            <div class="group">
              <div class="glabel">编码</div>
              <div class="prow">
                <div class="c-field"><label>分辨率</label>
                  <select class="c-select"><option>1920×1080</option><option>1280×720</option></select></div>
                <div class="c-field"><label>帧率</label>
                  <select class="c-select"><option>30</option><option>60</option></select></div>
              </div>
              <div class="c-field"><label>视频码率</label>
                <select class="c-select"><option>6000 kbps</option><option>4500 kbps</option><option>3000 kbps</option></select>
              </div>
            </div>

            <div class="group">
              <div class="glabel">本地存档</div>
              <div class="toggle">
                <div>
                  <div class="t1">同时保存到本地</div>
                  <div class="t2">分片 mp4，边推边存</div>
                </div>
                <div class="c-switch is-on"></div>
              </div>
              <div class="archpath">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="width:13px;height:13px;color:var(--fg-3)"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2.5h8.5A1.5 1.5 0 0 1 21 10v7.5A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5Z"/></svg>
                <span>D:\Tools\ffc\output\live</span>
              </div>
              <div class="c-field">
                <label>分片时长</label>
                <select class="c-select"><option>每 10 分钟一个文件</option><option>每 30 分钟一个文件</option><option>不切分</option></select>
                <div class="hint">意外断电最多丢最后一个分片，已写盘的部分可播。</div>
              </div>
            </div>
          </div>
          <div class="cta">
            <button class="c-btn is-primary is-block is-lg">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg>
              开始录屏推流
            </button>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
<div class="proto-tag">原型 v1 · 录屏推流</div>
<script src="../assets/shell.js"></script>
<script>
  ffcShell({
    active: 'live',
    title: '直播',
    sub: '录屏推流 · 屏幕采集',
    engine: { text: '就绪', path: '6.1' }
  });
</script>
<script src="../assets/nav.js"></script>
</body>
</html>
